name: Hourly AQI Fetcher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Create Credentials File
        env:
          GCP_CRED: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          echo "$GCP_CRED" > firebase-key.json
          
      - name: Run Fetchers
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_CREDENTIALS_PATH: firebase-key.json
          GOOGLE_APPLICATION_CREDENTIALS: firebase-key.json
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY}}
        run: |
          python fetch_aqi_weather.py
          python fetch_firms.py
